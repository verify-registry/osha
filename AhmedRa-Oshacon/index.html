        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Open Sans', Arial, sans-serif;
            background-color: #fff;
            color: #777;
            line-height: 24px;
            font-size: 14px;
        }
        
        /* ========== HEADER ========== */
        .header-container {
            background: #fff;
            border-top: 5px solid #ededed;
            padding: 10px 0;
            box-shadow: 0 1px 0 0 rgba(0,0,0,.05);
        }
        .logo img {
            max-height: 120px;
            width: auto;
        }
        .top-right-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 25px;
        }
        
        /* تصميم أيقونات الدخول والتسجيل للشاشات الكبيرة */
        .auth-buttons {
            display: flex;
            gap: 20px;
        }
        .auth-buttons a {
            font-size: 16px;
            font-weight: 400;
            color: #555;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .auth-buttons a i {
            font-size: 18px;
            color: #555;
        }
        .auth-buttons a:hover, .auth-buttons a:hover i {
            color: #000;
        }

        /* تصميم أيقونات السوشيال ميديا الدائرية بالهيدر */
        .social-icons-top {
            display: flex;
            gap: 8px;
        }
        .social-icons-top a {
            color: #333;
            background-color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            text-decoration: none;
            transition: all 0.2s ease-in-out;
        }
        .social-icons-top a:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }

        .mobile-menu-btn {
            background-color: #337ab7; /* اللون الأزرق الرسمي */
            color: #fff; /* لون الأيقونة أبيض */
            border: 1px solid #2e6da4;
            border-radius: 4px;
            font-size: 1.4rem;
            padding: 6px 12px; /* حشو عشان يدي شكل المربع المستطيل */
            display: none;
            transition: background-color 0.2s;
        }
        .mobile-menu-btn:hover, .mobile-menu-btn:focus {
            background-color: #286090; /* لون أغمق شوية عند الضغط */
            outline: none;
        }

        .offcanvas-top {
            height: auto;
            max-height: 250px;
            border-radius: 0 0 12px 12px;
        }
        .mobile-nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .mobile-nav-links li {
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
        }
        .mobile-nav-links li a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
