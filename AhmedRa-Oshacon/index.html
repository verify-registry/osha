<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Validate Student Certificate - OSHAcademy</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* منع الحركة بالعرض والمساحة البيضاء على اليمين */
        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Open Sans', Arial, sans-serif;
            background-color: #fff;
            color: #777;
            line-height: 24px;
            font-size: 14px;
        }
        
        /* ========== HEADER ========== */
        .header-container {
            background: #fff;
            border-top: 5px solid #ededed;
            padding: 10px 0;
            box-shadow: 0 1px 0 0 rgba(0,0,0,.05);
        }
        .logo img {
            max-height: 120px;
            width: auto;
        }
        .top-right-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 25px;
        }
        
        /* تصميم أيقونات الدخول والتسجيل */
        .auth-buttons {
            display: flex;
            gap: 20px;
        }
        .auth-buttons a {
            font-size: 16px;
            font-weight: 400;
            color: #555;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .auth-buttons a i {
            font-size: 18px;
            color: #555;
        }
        .auth-buttons a:hover, .auth-buttons a:hover i {
            color: #000;
        }

        /* تصميم أيقونات السوشيال ميديا الدائرية بالهيدر */
        .social-icons-top {
            display: flex;
            gap: 8px;
        }
        .social-icons-top a {
            color: #333;
            background-color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            text-decoration: none;
            transition: all 0.2s ease-in-out;
        }
        .social-icons-top a:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }

        /* ========== تصميم زرار الموبايل (الهامبرجر) ========== */
        .mobile-menu-btn {
            background-color: #337ab7; 
            color: #fff; 
            border: 1px solid #2e6da4;
            border-radius: 4px;
            font-size: 1.4rem;
            padding: 6px 12px; 
            display: none;
            transition: background-color 0.2s;
        }
        .mobile-menu-btn:hover, .mobile-menu-btn:focus {
            background-color: #286090; 
            outline: none;
        }

        .offcanvas-top {
            height: auto;
            max-height: 250px;
            border-radius: 0 0 12px 12px;
        }
        .mobile-nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .mobile-nav-links li {
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
        }
        .mobile-nav-links li a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ========== الميديا كويري للموبايل ========== */
        @media (max-width: 768px) {
            .header-container {
                padding: 12px 0; 
            }
            .logo img {
                max-height: 45px; 
            }
            .top-right-group .auth-buttons,
            .top-right-group .social-icons-top {
                display: none !important;
            }
            .mobile-menu-btn {
                display: block; 
            }
        }
        @media (min-width: 769px) {
            .mobile-only {
                display: none !important;
            }
        }

        /* ========== PAGE HEADER ========== */
        .page-header {
            background-color: #171717;
            border-top: 5px solid #2e353e;
            border-bottom: 5px solid #2e353e;
            padding: 25px 0;
            margin-bottom: 40px;
        }
        .page-header h1 {
            font-size: 1.8em;
            font-weight: 300;
            color: #fff;
            margin: 0;
            border-bottom: none;
        }
        .breadcrumb-custom {
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .breadcrumb-custom a {
            color: #0088cc;
            text-decoration: none;
        }
        .breadcrumb-custom span {
            color: #999;
        }

        /* ========== AUTHENTIC BLOCK ========== */
        .authentic-block {
            margin-bottom: 30px;
        }
        .authentic-title {
            font-size: 24px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 0;
        }
        .authentic-text {
            font-size: 16px;
            color: #777;
        }

        /* ========== FORM STYLES ========== */
        .form-label {
            font-weight: 600;
            color: #333;
        }
        .form-control-lg {
            font-size: 14px;
            padding: 12px 15px;
            border-radius: 4px;
        }
        .btn-success {
            background-color: #47a447;
            border-color: #398439;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 4px;
        }
        .btn-success:hover {
            background-color: #398439;
            border-color: #2d672d;
        }

        /* ========== RESULT PANEL ========== */
        .panel-success {
            border: 1px solid #d6e9c6;
            border-radius: 4px;
            box-shadow: 0 1px 1px rgba(0,0,0,.05);
            display: none; /* المربع مخفي في البداية زي ما طلبت */
        }
        .panel-heading {
            background-color: #dff0d8;
            color: #3c763d;
            padding: 15px 20px;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 1px solid #d6e9c6;
            border-top-left-radius: 3px;
            border-top-right-radius: 3px;
        }
        .panel-body {
            padding: 25px;
            background-color: #fff;
        }
        .table {
            margin-bottom: 20px;
        }
        .table > thead > tr > th {
            border-bottom: 2px solid #ddd;
            font-weight: 600;
            color: #333;
            padding: 12px 8px;
        }
        .table > tbody > tr > td {
            padding: 12px 8px;
            vertical-align: middle;
        }
        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: #f9f9f9;
        }
        .authentic-certificate {
            font-weight: 600;
            color: #333;
            width: 35%;
        }

        /* ========== FOOTER ========== */
        footer {
            background-color: #1a2a36;
            color: #cddce9;
            margin-top: 60px;
            padding: 45px 0 0;
            font-size: 13px;
        }
        footer h4 {
            color: #fff;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .footer-social-icons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .footer-social-icons a {
            color: #e2e2e2;
            font-size: 1.8rem;
